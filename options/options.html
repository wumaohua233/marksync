<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title data-i18n="optionsTitle">MarkSync · 设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "PingFang SC", "Hiragino Sans", "Yu Gothic UI", "Microsoft YaHei", "Noto Sans CJK", sans-serif; background: #fafafa; color: #333; }
    .wrap { max-width: 560px; margin: 40px auto; background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 28px 32px; }
    h1 { font-size: 18px; margin-bottom: 24px; }
    h2 { font-size: 14px; margin: 24px 0 12px; color: #666; font-weight: 600; }
    label { display: block; font-size: 13px; margin-bottom: 4px; color: #555; }
    input[type=text], input[type=password], input[type=number], select {
      width: 100%; border: 1px solid #ddd; border-radius: 6px; padding: 8px 10px; font-size: 13px; margin-bottom: 12px;
    }
    input:focus, select:focus { outline: none; border-color: #FF2442; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .interval { display: flex; gap: 8px; }
    .interval input { flex: 1; }
    .interval select { width: 90px; flex-shrink: 0; }
    button { border: 1px solid #ddd; background: #fff; border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
    button.primary { background: #FF2442; border-color: #FF2442; color: #fff; }
    .btn-row { display: flex; gap: 10px; margin-top: 28px; align-items: center; }
    #msg { font-size: 12px; margin-left: 4px; }
    #msg.ok { color: #52c41a; }
    #msg.err { color: #d4380d; }
    .hint { font-size: 12px; color: #999; margin-top: -8px; margin-bottom: 12px; }
    .src-group { margin-bottom: 14px; }
    .src-plat { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
    .src-items { display: flex; flex-wrap: wrap; gap: 14px; }
    .src-item { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #555; margin-bottom: 0; cursor: pointer; }
    .src-item input[type=checkbox] { width: auto; margin: 0; }
    .lim-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .lim-row .lim-name { flex: 1; font-size: 13px; color: #555; }
    .lim-row input[type=number] { width: 78px; margin-bottom: 0; text-align: center; }
    .lim-row .lim-unit { font-size: 12px; color: #bbb; width: 42px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 data-i18n="optionsTitle">MarkSync · 设置</h1>

    <h2 data-i18n="optSecInterval">检测策略</h2>
    <div class="row">
      <div>
        <label data-i18n="optLabelInterval">自动检测间隔</label>
        <div class="interval">
          <input type="number" id="intervalValue" min="0.5" step="any">
          <select id="intervalUnit">
            <option value="1" data-i18n="unitMinute">分钟</option>
            <option value="60" data-i18n="unitHour">小时</option>
            <option value="1440" data-i18n="unitDay">天</option>
          </select>
        </div>
      </div>
    </div>

    <h2 data-i18n="optSecSources">同步的平台与内容</h2>
    <div class="hint" data-i18n="optHintSources">只检测勾选的；取消勾选的会被跳过。</div>
    <div id="sources"></div>

    <h2 data-i18n="optSecFirstRun">首次同步条数</h2>
    <div class="hint" data-i18n="optFirstRunHint"></div>
    <div id="limits"></div>

    <div class="btn-row">
      <button class="primary" id="btn-save" data-i18n="btnSave">保存</button>
      <span id="msg"></span>
    </div>

    <h2 data-i18n="optSecData">数据</h2>
    <div class="btn-row" style="margin-top:0">
      <button id="btn-clear" data-i18n="btnClear">清空清单并重新全量导入</button>
      <button id="btn-onboarding" data-i18n="optBtnOnboarding">重新打开新手引导</button>
    </div>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
