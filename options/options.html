<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="optionsTitle">MarkSync · 设置</title>
  <link rel="stylesheet" href="../lib/glass.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--ms-font); color: var(--ms-ink);
      background: #eceff4; -webkit-font-smoothing: antialiased;
      min-height: 100vh; padding: 40px 22px 60px;
    }
    /* 背景铺满整页并固定，滚动时不动 —— 动的话卡片后面的颜色会"流"过去，很晕 */
    body > .ms-bg { position: fixed; }

    .wrap {
      position: relative; max-width: 620px; margin: 0 auto;
      border-radius: 28px; padding: 30px 34px 34px;
      display: flex; flex-direction: column; gap: 0;
    }

    .head { display: flex; align-items: center; gap: 11px; margin-bottom: 26px; }
    .head img { width: 34px; height: 34px; border-radius: 11px; box-shadow: 0 6px 14px -6px rgba(255,36,66,.5); }
    h1 { font-size: 19px; font-weight: 700; letter-spacing: -.2px; }

    h2 {
      font-size: 13px; font-weight: 650; color: var(--ms-ink-2);
      margin: 26px 0 10px; letter-spacing: .3px;
    }
    h2:first-of-type { margin-top: 0; }

    label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--ms-ink-2); }

    input[type=text], input[type=password], input[type=number], select {
      width: 100%; font: inherit; font-size: 13.5px; color: var(--ms-ink);
      background: rgba(255,255,255,.62); border: 1px solid rgba(255,255,255,.85);
      border-radius: 11px; padding: 9px 12px; margin-bottom: 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
      transition: border-color .2s, box-shadow .2s, background .2s;
      -webkit-appearance: none; appearance: none;
    }
    @media (prefers-color-scheme: dark) {
      input[type=text], input[type=password], input[type=number], select {
        background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.16);
      }
    }
    input:focus, select:focus {
      outline: none; border-color: var(--ms-brand);
      box-shadow: 0 0 0 3px rgba(255,36,66,.16), inset 0 1px 0 rgba(255,255,255,.8);
    }
    select { background-image: none; cursor: pointer; }

    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .interval { display: flex; gap: 8px; }
    .interval input { flex: 1; margin-bottom: 0; }
    .interval select { width: 96px; flex-shrink: 0; margin-bottom: 0; }

    button {
      font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
      border-radius: 12px; padding: 9px 18px;
      border: 1px solid rgba(255,255,255,.75); background: rgba(255,255,255,.6); color: var(--ms-ink);
      transition: transform .28s var(--ms-spring), background .2s, color .2s, box-shadow .28s;
    }
    button:hover { background: rgba(255,255,255,.9); }
    button:active { transform: scale(.96); }
    button.primary {
      background: linear-gradient(160deg, #ff3b57, var(--ms-brand) 70%);
      border-color: transparent; color: #fff;
      box-shadow: 0 8px 20px -8px rgba(255,36,66,.65), inset 0 1px 0 rgba(255,255,255,.3);
    }
    button.primary:hover { box-shadow: 0 11px 24px -8px rgba(255,36,66,.72), inset 0 1px 0 rgba(255,255,255,.3); }

    .btn-row { display: flex; gap: 10px; margin-top: 26px; align-items: center; flex-wrap: wrap; }
    #msg { font-size: 12.5px; margin-left: 2px; font-weight: 500; }
    #msg.ok { color: #10b981; }
    #msg.err { color: #d4380d; }
    .hint { font-size: 12px; color: var(--ms-ink-3); margin: -4px 0 12px; line-height: 1.6; }

    /* 数据源开关 */
    .src-group { margin-bottom: 14px; }
    .src-plat { display: block; font-size: 13px; font-weight: 650; margin-bottom: 7px; }
    .src-items { display: flex; flex-wrap: wrap; gap: 10px; }
    .src-item {
      display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
      font-size: 13px; color: var(--ms-ink-2); margin-bottom: 0;
      padding: 6px 13px 6px 10px; border-radius: 999px;
      background: rgba(255,255,255,.45); border: 1px solid rgba(255,255,255,.7);
      transition: background .2s, color .2s, transform .28s var(--ms-spring);
    }
    @media (prefers-color-scheme: dark) { .src-item { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.13); } }
    .src-item:hover { background: rgba(255,255,255,.8); color: var(--ms-ink); }
    .src-item:active { transform: scale(.96); }
    .src-item:has(input:checked) { color: var(--ms-ink); font-weight: 600; background: rgba(255,255,255,.85); }
    .src-item input[type=checkbox] { width: 15px; height: 15px; margin: 0; accent-color: var(--ms-brand); cursor: pointer; }

    /* 首次同步条数 */
    .lim-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .lim-row .lim-name { flex: 1; font-size: 13px; color: var(--ms-ink-2); }
    .lim-row input[type=number] { width: 82px; margin-bottom: 0; text-align: center; }
    .lim-row .lim-unit { font-size: 12px; color: var(--ms-ink-3); width: 44px; }
  </style>
</head>
<body>
  <div class="ms-bg"></div>
  <div class="wrap ms-glass">
    <div class="head">
      <img src="../icons/128.png" alt="">
      <h1 data-i18n="optionsTitle">MarkSync · 设置</h1>
    </div>

    <h2 data-i18n="optSecInterval">检测策略</h2>
    <div class="row">
      <div>
        <label data-i18n="optLabelInterval">自动检测间隔</label>
        <div class="interval">
          <input type="number" id="intervalValue" min="0.5" step="any">
          <select id="intervalUnit">
            <option value="1" data-i18n="unitMinute">分钟</option>
            <option value="60" data-i18n="unitHour">小时</option>
            <option value="1440" data-i18n="unitDay">天</option>
          </select>
        </div>
      </div>
    </div>

    <h2 data-i18n="optSecSources">同步的平台与内容</h2>
    <div class="hint" data-i18n="optHintSources">只检测勾选的；取消勾选的会被跳过。</div>
    <div id="sources"></div>

    <h2 data-i18n="optSecFirstRun">首次同步条数</h2>
    <div class="hint" data-i18n="optFirstRunHint"></div>
    <div id="limits"></div>

    <div class="btn-row">
      <button class="primary" id="btn-save" data-i18n="btnSave">保存</button>
      <span id="msg"></span>
    </div>

    <h2 data-i18n="optSecData">数据</h2>
    <div class="btn-row" style="margin-top:0">
      <button id="btn-clear" data-i18n="btnClear">清空清单并重新全量导入</button>
      <button id="btn-onboarding" data-i18n="optBtnOnboarding">重新打开新手引导</button>
    </div>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
