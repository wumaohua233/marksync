<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>MarkSync — saved & liked, all in one list</title>
<meta name="description" content="Syncs new saves and likes from Xiaohongshu/Douyin/YouTube/X/TikTok/Instagram. Fully local, open source, nothing is uploaded.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --red: #FF2442;
    --ink: #1c1c1e;
    --gray: #6e6e73;
    --glass: rgba(255, 255, 255, .55);
    --glass-border: rgba(255, 255, 255, .75);
    --shadow: 0 24px 60px -24px rgba(60, 40, 90, .18);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans", "Yu Gothic UI", "Microsoft YaHei", "Noto Sans CJK", sans-serif;
    color: var(--ink);
    line-height: 1.65;
    background: #fbfbfd;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; }

  /* ---------- iOS 26 流动极光背景 ---------- */
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; will-change: transform; }
  .b1 { width: 55vmax; height: 55vmax; left: -18vmax; top: -20vmax; background: radial-gradient(circle at 35% 35%, #ffd3c7, #ffb3a1 60%, transparent 72%); animation: drift1 26s ease-in-out infinite alternate; }
  .b2 { width: 48vmax; height: 48vmax; right: -16vmax; top: -8vmax; background: radial-gradient(circle at 60% 40%, #ffe3ee, #ffc2d6 55%, transparent 70%); animation: drift2 32s ease-in-out infinite alternate; }
  .b3 { width: 42vmax; height: 42vmax; left: 22vw; top: 60vh; background: radial-gradient(circle at 50% 50%, #e6e0ff, #d3f0ff 55%, transparent 72%); opacity: .45; animation: drift3 38s ease-in-out infinite alternate; }
  .b4 { width: 36vmax; height: 36vmax; right: 4vw; bottom: -14vmax; background: radial-gradient(circle at 50% 50%, #fff1d6, #ffe1b8 55%, transparent 70%); opacity: .4; animation: drift1 30s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { transform: translate(6vmax, 4vmax) scale(1.12); } }
  @keyframes drift2 { to { transform: translate(-5vmax, 6vmax) scale(1.08) rotate(12deg); } }
  @keyframes drift3 { to { transform: translate(4vmax, -5vmax) scale(1.15); } }
  @media (prefers-reduced-motion: reduce) { .blob, .logo { animation: none; } }

  /* ---------- 玻璃拟态 ---------- */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(28px) saturate(1.7);
    backdrop-filter: blur(28px) saturate(1.7);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.8);
  }

  /* ---------- Hero ---------- */
  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 90px 22px 40px; position: relative; z-index: 2; }
  .langs { position: fixed; top: 18px; right: 20px; z-index: 10; display: flex; gap: 6px; padding: 5px; }
  .langs button { border: none; background: transparent; color: var(--gray); font-size: 12.5px; font-weight: 500; padding: 5px 13px; border-radius: 999px; cursor: pointer; font-family: inherit; transition: all .18s ease; }
  .langs button:hover { color: var(--ink); }
  .langs button.on { background: rgba(255,255,255,.95); color: var(--red); font-weight: 600; box-shadow: 0 2px 10px rgba(0,0,0,.08); }

  .logo { width: 108px; height: 108px; border-radius: 27%; display: block; margin-bottom: 34px; box-shadow: 0 24px 50px -14px rgba(255,36,66,.5), 0 2px 8px rgba(255,36,66,.25); animation: float 5s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-9px); } }

  h1 { font-size: clamp(46px, 9vw, 84px); font-weight: 800; letter-spacing: -.035em; line-height: 1.05; }
  .sub { font-size: clamp(16px, 2.4vw, 20px); color: var(--gray); max-width: 560px; margin: 18px auto 0; letter-spacing: -.01em; }
  .sub em { font-style: normal; color: var(--red); font-weight: 600; }

  .dl {
    display: inline-flex; align-items: center; gap: 10px; margin-top: 40px;
    background: linear-gradient(180deg, #ff4d63, var(--red) 55%, #f01230);
    color: #fff; font-size: 18px; font-weight: 600; letter-spacing: .01em;
    padding: 17px 40px; border-radius: 999px; text-decoration: none;
    box-shadow: 0 18px 40px -10px rgba(255,36,66,.55), inset 0 1.5px 1px rgba(255,255,255,.45), inset 0 -2px 6px rgba(160,0,25,.3);
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;
  }
  .dl:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 24px 50px -10px rgba(255,36,66,.6), inset 0 1.5px 1px rgba(255,255,255,.45), inset 0 -2px 6px rgba(160,0,25,.3); }
  .dl:active { transform: translateY(0) scale(.98); }
  .dl .arr { font-size: 20px; }
  .dl-note { display: block; margin-top: 16px; font-size: 13px; color: rgba(110,110,115,.85); }

  .plats-lead { margin-top: 46px; font-size: 12.5px; letter-spacing: .18em; color: rgba(110,110,115,.65); }
  .plats { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-top: 12px; }
  .plat { background: rgba(255,255,255,.5); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.8); border-radius: 999px; padding: 7px 17px; font-size: 13.5px; font-weight: 500; color: #55443f; box-shadow: 0 6px 18px -8px rgba(80,50,60,.18); transition: transform .15s ease; }
  .plat:hover { transform: translateY(-2px); }

  footer { text-align: center; padding: 0 0 34px; color: rgba(110,110,115,.75); font-size: 13px; position: relative; z-index: 2; }
  footer a { color: var(--red); text-decoration: none; }

  @media (max-width: 600px) {
    .logo { width: 92px; height: 92px; }
    .hero { padding-top: 76px; }
  }
</style>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  </div>

  <div class="langs glass" id="langs"></div>

  <header class="hero">
    <img class="logo" src="icon.png" alt="MarkSync" width="108" height="108">
    <h1 data-i18n="name">MarkSync</h1>
    <p class="sub" data-i18n-html="tagline">Syncs new <em>saves and likes</em> from every platform — so the things you saved for later actually get looked at.</p>
    <a class="dl" id="dl" href="https://github.com/wumaohua233/marksync/releases/latest"><span class="arr">⬇</span> <span data-i18n="dl">Download</span></a>
    <span class="dl-note" data-i18n="dlNote">Fully local · Nothing is uploaded</span>
    <p class="plats-lead" data-i18n="platLead">NOW SUPPORTING</p>
    <div class="plats" id="plats"></div>
  </header>

  <footer>
    <a href="https://github.com/wumaohua233/marksync">GitHub</a> · GPL-3.0 ·
    <span data-i18n="footer">A personal toy project, shared for learning</span>
  </footer>

<script>
const REPO = "wumaohua233/marksync";
const API  = "https://api.github.com/repos/" + REPO + "/releases/latest";

// 顺序即按钮顺序：EN → 日本語 → 中文；默认英语
const I18N = {
  en: {
    title: "MarkSync — saved & liked, all in one list",
    name: "MarkSync",
    tagline: 'Syncs new <em>saves and likes</em> from every platform — so the things you saved for later actually get looked at.',
    dl: "Download", dlNote: "Fully local · Nothing is uploaded", platLead: "N O W  S U P P O R T I N G",
    footer: "A personal toy project, shared for learning",
  },
  ja: {
    title: "MarkSync — 保存といいねをひとつのリストに",
    name: "MarkSync",
    tagline: "各プラットフォームの<em>保存といいね</em>を自動で同期。あとで見るつもりが溜まったまま、を解消します。",
    dl: "ダウンロード", dlNote: "完全ローカル · 送信なし", platLead: "対 応 中",
    footer: "個人の趣味プロジェクトです",
  },
  zh_CN: {
    title: "MarkSync — 收藏点赞同步",
    name: "MarkSync",
    tagline: '自动同步你在各平台的<em>收藏与点赞</em>，专治"刷到就收藏，收藏就吃灰"。',
    dl: "下载插件", dlNote: "纯本地 · 不上传任何数据", platLead: "现 已 支 持",
    footer: "个人玩具项目，仅供学习交流",
  },
};

const PLATFORMS = {
  en: ["Xiaohongshu", "Douyin", "YouTube", "X", "TikTok", "Instagram"],
  ja: ["小紅書", "抖音", "YouTube", "X", "TikTok", "Instagram"],
  zh_CN: ["小红书", "抖音", "YouTube", "X", "TikTok", "Instagram"],
};
const LANG_NAMES = { en: "EN", ja: "日本語", zh_CN: "中文" };

const saved = localStorage.getItem("marksync-lang");
const fromUrl = new URLSearchParams(location.search).get("lang");
let lang = [saved, fromUrl].find((v) => v && I18N[v]) || "en";

function apply(next) {
  lang = next;
  localStorage.setItem("marksync-lang", lang);
  const d = I18N[lang];
  document.documentElement.lang = lang.replace("_", "-");
  document.title = d.title;

  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const v = d[el.dataset.i18n];
    if (v != null) el.textContent = v;
  });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => {
    const v = d[el.dataset.i18nHtml];
    if (v != null) el.innerHTML = v;
  });

  document.getElementById("plats").innerHTML = PLATFORMS[lang]
    .map((p) => `<span class="plat">${p}</span>`)
    .join("");

  document.getElementById("langs").innerHTML = Object.keys(I18N)
    .map((k) => `<button data-lang="${k}" class="${k === lang ? "on" : ""}">${LANG_NAMES[k]}</button>`)
    .join("");
  document.querySelectorAll("#langs button").forEach((b) => {
    b.addEventListener("click", () => apply(b.dataset.lang));
  });

  renderDl();
}

let release = null;

// 下载按钮上的版本号：拿到了就显示，没拿到就只显示「下载」，不显示假版本号
function renderDl() {
  const dl = document.getElementById("dl");
  if (release?.zip) dl.href = release.zip;
  const v = release?.version ? " v" + release.version : "";
  dl.innerHTML = `<span class="arr">⬇</span> <span>${I18N[lang].dl}${v}</span>`;
}

// 版本和下载链接的取值顺序：
//   ① version.json —— 同源，zip 就在本站 dl/ 下。发版时由 GitHub Action 镜像过来。
//      同源意味着用户的浏览器不需要连 GitHub 就能下载，慢网络/直连不通时照样能用。
//   ② GitHub Releases API —— dl/ 还没生成时兜底。
//   ③ Releases 页面 —— 全都失败（离线 / 限流 / 还没发过版）时的兑底，点击仍然能用。
async function loadRelease() {
  const fallback = `https://github.com/${REPO}/releases/latest`;

  // ① 同源镜像
  try {
    const r = await fetch("version.json", { cache: "no-store" });
    if (r.ok) {
      const j = await r.json();
      if (j && j.version && j.file) {
        const href = "dl/" + j.file;
        release = { version: String(j.version), zip: href, url: href };
        renderDl();
        return;
      }
    }
  } catch (_) {
    /* 没有 version.json，往下走 */
  }

  // ② GitHub Releases API
  try {
    const r = await fetch(API, { headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const version = String(j.tag_name || "").replace(/^v/i, "");
    const asset = (j.assets || []).find((a) => a.name.endsWith(".zip"));
    release = { version, url: j.html_url || fallback, zip: asset ? asset.browser_download_url : null };
  } catch (_) {
    // ③ 全挂
    release = { version: null, url: fallback, zip: null };
  }
  renderDl();
}

apply(lang);
loadRelease();
</script>
</body>
</html>
