<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; min-width: 0; }
    body { width: 520px; font-family: -apple-system, "PingFang SC", "Hiragino Sans", "Yu Gothic UI", "Microsoft YaHei", "Noto Sans CJK", sans-serif; }
    .popup-root { width: 100%; max-width: 100%; max-height: 560px; overflow-y: auto; overflow-x: hidden; background: #fafafa; }
    img, svg, canvas { display: block; max-width: 100%; }
    header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #eee; padding: 12px 14px; z-index: 10; }
    .title-row { display: flex; align-items: center; justify-content: space-between; }
    h1 { font-size: 15px; font-weight: 600; }
    .unread { background: #FF2442; color: #fff; font-size: 11px; border-radius: 9px; padding: 1px 8px; margin-left: 6px; }
    .actions { display: flex; gap: 6px; }
    button { border: 1px solid #ddd; background: #fff; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: #333; }
    button:hover { background: #f5f5f5; }
    button.primary { background: #FF2442; border-color: #FF2442; color: #fff; }
    button.primary:hover { background: #e01e3a; }
    button:disabled { opacity: .5; cursor: default; }
    .status { font-size: 11px; color: #999; margin-top: 6px; }
    .status .err { color: #d4380d; }
    .first-run { margin-top: 5px; color: #ad6800; background: #fff7e6; border: 1px solid #ffe1b3; border-radius: 6px; padding: 5px 8px; line-height: 1.45; }
    .tabs { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
    .tab { flex-shrink: 0; font-size: 11px; color: #666; padding: 3px 8px; border-radius: 12px; cursor: pointer; border: none; background: #f0f0f1; }
    .tab:hover { background: #e8e8ea; }
    .tab.active { background: #FF2442; color: #fff; }
    .tab .cnt { font-size: 10px; opacity: .75; margin-left: 2px; }
    .group-label { font-size: 12px; color: #999; padding: 10px 14px 4px; }
    .group-label .gl-time { color: #c4c4c4; font-weight: normal; }
    .t-date { color: #FF2442; }
    .t-time { color: #9a9a9a; }
    .item { display: flex; gap: 10px; padding: 10px 14px; background: #fff; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
    .item:hover { background: #f9f9f9; }
    .item.read { opacity: .55; }
    .item img { width: 52px; height: 68px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: #f5f5f5; opacity: 0; transition: opacity .18s ease; }
    .item img.loaded { opacity: 1; }
    .item .body { flex: 1; min-width: 0; }
    .item .t { font-size: 13px; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item .meta { font-size: 11px; color: #aaa; margin-top: 4px; }
    .mark-read { align-self: center; flex-shrink: 0; font-size: 11px; color: #FF2442; border: 1px solid #FF2442; background: #fff; border-radius: 10px; padding: 2px 8px; cursor: pointer; }
    .mark-read:hover { background: #FF2442; color: #fff; }
    .login-inline { font-size: 11px; color: #FF2442; border: 1px solid #FF2442; background: #fff; border-radius: 10px; padding: 1px 8px; cursor: pointer; margin-left: 4px; vertical-align: 1px; }
    .login-inline:hover { background: #FF2442; color: #fff; }
    .dot { display: inline-block; width: 6px; height: 6px; background: #FF2442; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
    .empty { text-align: center; color: #bbb; font-size: 13px; padding: 60px 0; }
    .running-tip { font-size: 11px; color: #FF2442; margin-top: 6px; display: none; }
    .login-bar { display: none; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 8px; padding: 8px 10px; background: #fff7e6; border: 1px solid #ffe1b3; border-radius: 8px; }
    .login-bar .tip { font-size: 12px; color: #ad6800; }
    .login-btn { font-size: 12px; color: #fff; border: none; }
    .login-btn[data-platform="xhs"] { background: #FF2442; }
    .login-btn[data-platform="xhs"]:hover { background: #e01e3a; }
    .login-btn[data-platform="douyin"] { background: #161823; }
    .login-btn[data-platform="douyin"]:hover { background: #000; }
    .login-btn[data-platform="youtube"] { background: #FF0000; }
    .login-btn[data-platform="youtube"]:hover { background: #cc0000; }
    .login-btn[data-platform="x"] { background: #000; }
    .login-btn[data-platform="x"]:hover { background: #333; }
    .login-btn[data-platform="tiktok"] { background: #FE2C55; }
    .login-btn[data-platform="tiktok"]:hover { background: #d81f43; }
    .login-btn[data-platform="instagram"] { background: #C13584; }
    .login-btn[data-platform="instagram"]:hover { background: #a02c6f; }
    .split-btn { position: relative; display: inline-flex; }
    .split-btn #btn-run { border-radius: 6px 0 0 6px; }
    .split-btn .caret { border-radius: 0 6px 6px 0; border-left: 1px solid rgba(255,255,255,.35); padding: 4px 7px; font-size: 10px; }
    .sync-menu { position: absolute; top: calc(100% + 4px); right: 0; background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.16); padding: 4px; z-index: 30; min-width: 168px; }
    .sync-menu[hidden] { display: none; }
    .sync-menu button { display: block; width: 100%; text-align: left; border: none; background: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; }
    .sync-menu button:hover { background: #f5f5f5; }
    .sync-menu .p-name { display: block; font-size: 13px; color: #333; white-space: nowrap; }
    .sync-menu .p-time { display: block; font-size: 10px; color: #b8b8b8; margin-top: 1px; white-space: nowrap; }
    .update-bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 7px 10px; background: #e6f4ff; border: 1px solid #91caff; border-radius: 8px; font-size: 12px; color: #0958d9; }
    .update-bar[hidden] { display: none; }
    .update-bar .u-text { flex: 1; }
    .update-bar .u-go { font-size: 12px; color: #fff; background: #1677ff; border: none; border-radius: 6px; padding: 3px 10px; cursor: pointer; }
    .update-bar .u-go:hover { background: #0958d9; }
    .update-bar .u-x { border: none; background: none; color: #69b1ff; font-size: 15px; line-height: 1; padding: 0 2px; cursor: pointer; }
    .update-bar .u-x:hover { color: #0958d9; }
  </style>
</head>
<body>
  <div class="popup-root">
  <header>
    <div class="title-row">
      <h1><span data-i18n="extName">MarkSync</span><span class="unread" id="unread" style="display:none"></span></h1>
      <div class="actions">
        <button id="btn-export" data-i18n="btnExport">导出</button>
        <button id="btn-read-all" data-i18n="btnReadAll">全部已读</button>
        <div class="split-btn">
          <button id="btn-run" class="primary" data-i18n="btnSync">同步</button>
          <button id="btn-run-more" class="primary caret" data-i18n-title="btnRunMoreTitle" title="选择平台单独同步">▾</button>
          <div id="sync-menu" class="sync-menu" hidden></div>
        </div>
        <button id="btn-settings" data-i18n="btnSettings">设置</button>
      </div>
    </div>
    <div class="update-bar" id="update-bar" hidden>
      <span class="u-text" id="update-text"></span>
      <button class="u-go" id="update-go"></button>
      <button class="u-x" id="update-dismiss">×</button>
    </div>
    <div class="status" id="status"></div>
    <div class="login-bar" id="login-bar"></div>
    <div class="tabs" id="tabs"></div>
    <div class="running-tip" id="running-tip" data-i18n="runningTip">正在后台检测，请稍候…</div>
  </header>
  <main id="list"></main>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
